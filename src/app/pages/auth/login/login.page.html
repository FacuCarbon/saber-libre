<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">login</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="login-container">
    <div class="login-card">

      // logo
      <div class="login-header">
        <img class="login-logo" src="../saber-libre-assets/pngs/04_isotipo_transparente.png" alt="Saber Libre">
        <h1>Saber Libre</h1>
        <p>Inicia sesión para continuar</p>
      </div>

      // error
      @if (error) {
      <div class="error-box">
        <ion-icon name="alert-circle"></ion-icon>
        <span>{{ error }}</span>
      </div>
      }

      // form
      <form (ngSubmit)="login()">
        <ion-item class="login-item">
          <ion-label position="stacked">
            <ion-icon name="mail-outline"></ion-icon>
            Correo electrónico
          </ion-label>
          <ion-input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="tu@correo.com"
            required
          ></ion-input>
        </ion-item>

        <ion-item class="login-item">
          <ion-label position="stacked">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Contraseña
          </ion-label>
          <ion-input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            required
          ></ion-input>
        </ion-item>

        <div class="forgot-link">
          <a routerLink="/auth/recuperar">¿Olvidaste tu contraseña?</a>
        </div>

        <ion-button type="submit" expand="block" class="btn-primary">
          Iniciar Sesión
        </ion-button>
      </form>

      // divider
      <div class="divider">
        <span>o continúa con</span>
      </div>

      // google
      <ion-button
        expand="block"
        fill="outline"
        class="btn-google"
        (click)="loginGoogle()"
      >
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Iniciar Sesión con Google
      </ion-button>

      // registro
      <p class="register-link">
        ¿No tenés cuenta?
        <a routerLink="/auth/register">Registrate</a>
      </p>

    </div>
  </div>

</ion-content>
