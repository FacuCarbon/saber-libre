<ion-content class="register-content">
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <img
          class="register-logo"
          src="./../../../../assets/icon/logo_login.png"
          alt="Saber Libre"
        />
        <h1>Saber Libre</h1>
        <p>Creá tu cuenta</p>
      </div>

      @if (error) {
      <div class="error-box">
        <ion-icon name="alert-circle"></ion-icon>
        <span>{{ error }}</span>
      </div>
      }

      <form (ngSubmit)="register()">
        <ion-item class="register-item">
          <ion-label position="stacked">
            <ion-icon name="person-outline"></ion-icon>
            Nombre completo
          </ion-label>
          <ion-input
            type="text"
            name="nombreCompleto"
            [(ngModel)]="nombreCompleto"
            placeholder="Tu nombre"
            required
          ></ion-input>
        </ion-item>

        <ion-item class="register-item">
          <ion-label position="stacked">
            <ion-icon name="mail-outline"></ion-icon>
            Correo electrónico
          </ion-label>
          <ion-input
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="tu@correo.com"
            required
          ></ion-input>
        </ion-item>

        <ion-item class="register-item">
          <ion-label position="stacked">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Contraseña
          </ion-label>
          <ion-input
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            minlength="6"
            required
          ></ion-input>
        </ion-item>

        <ion-item class="register-item">
          <ion-label position="stacked">
            <ion-icon name="lock-closed-outline"></ion-icon>
            Confirmar contraseña
          </ion-label>
          <ion-input
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="••••••••"
            minlength="6"
            required
          ></ion-input>
        </ion-item>

        <ion-button type="submit" expand="block" class="btn-primary">
          Crear Cuenta
        </ion-button>
      </form>

      <div class="divider">
        <span>o registrate con</span>
      </div>

      <ion-button
        expand="block"
        fill="outline"
        class="btn-google"
        (click)="registerGoogle()"
      >
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Google
      </ion-button>

      <p class="login-link">
        ¿Ya tenés cuenta?
        <a routerLink="/auth/login">Iniciá sesión</a>
      </p>
    </div>
  </div>
</ion-content>
