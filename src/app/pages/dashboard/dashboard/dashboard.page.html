<ion-app>
  <ion-split-pane contentId="main-content">
    <ion-menu contentId="main-content" type="overlay" class="menu-sidebar">
      <div>
        <logo-app></logo-app>
      </div>
      <!--Mostramos el rol del usuario actual-->
      @if (rol) {
      <div class="ion-padding container-rol">
        <ion-label class="rol">{{ rol }}</ion-label>
      </div>
      }
      <ion-content>
        <app-sidebar-menu></app-sidebar-menu>
      </ion-content>

      <div class="ion-padding">
        <ion-button expand="block" class="boton-logout" (click)="logout()">
          <ion-icon
            name="log-out-outline"
            style="margin-right: 10px"
          ></ion-icon>
          Cerrar sesión
        </ion-button>
      </div>
    </ion-menu>

    <div class="ion-page container-children" id="main-content">
      <ion-header>
        @if (usuario) {
        <ion-toolbar>
          <ion-title class="saludo-usuario"
            >{{tituloPaginaActual}} / {{mostrarSaludo()}},
            {{usuario.nombreCompleto}}</ion-title
          >
        </ion-toolbar>
        }
      </ion-header>

      <ion-content class="ion-padding">
        <router-outlet (activate)="actualizarPaginaActual()"></router-outlet>
      </ion-content>

      <ion-footer class="ion-hide-lg-up">
        <ion-tab-bar>
          @for (item of rutasTabs; track item.url) {
          <ion-tab-button
            [routerLink]="item.url"
            routerLinkActive="route-active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
          >
            <ion-icon [name]="item.icon"></ion-icon>
            <ion-label>{{ item.title }}</ion-label>
          </ion-tab-button>
          }

          <ion-tab-button
            id="mobile-more-trigger"
            [class.route-active]="masActivo"
          >
            <ion-icon name="ellipsis-horizontal-outline"></ion-icon>
            <ion-label>Más</ion-label>
          </ion-tab-button>
        </ion-tab-bar>

        <ion-popover
          trigger="mobile-more-trigger"
          triggerAction="click"
          [dismissOnSelect]="true"
          class="more-popover"
        >
          <ng-template>
            <ion-list lines="none">
              @for (item of rutasMas; track item.url) {
              <ion-item
                button
                [routerLink]="item.url"
                routerLinkActive="route-active"
                [routerLinkActiveOptions]="{ exact: item.exact ?? true }"
              >
                <ion-icon [name]="item.icon" slot="start"></ion-icon>
                <ion-label>{{ item.title }}</ion-label>
              </ion-item>
              }
            </ion-list>
          </ng-template>
        </ion-popover>
      </ion-footer>
    </div>
  </ion-split-pane>
</ion-app>
