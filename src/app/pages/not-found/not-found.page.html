<ion-content class="not-found-content">
  <div class="container">
    <logo-app class="logo"></logo-app>

    <div class="code">404</div>

    <h1 class="title">Fuera de catálogo</h1>
    <p class="subtitle">
      Parece que esta página no existe en nuestra biblioteca.
      <br />
      Puede que la hayan prestado y no la devolvieron.
    </p>

    <div class="actions">
      <app-boton-accion
        texto="Explorar catálogo"
        icono="library-outline"
        (accion)="irACatalogo()"

      <app-boton-accion
        texto="Volver al inicio"
        icono="home-outline"
        (accion)="irAInicio()"
      ></app-boton-accion>
    </div>
  </div>
</ion-content>
